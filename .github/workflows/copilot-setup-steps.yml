name: Copilot setup steps

# Prepares the Copilot coding agent's environment with the same toolchain and
# emulator packages as scripts/verify_all.sh needs. Runs only for the agent or
# when started by hand.
on: workflow_dispatch

permissions:
  contents: read

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master 2026-10-16
        with:
          toolchain: stable
          targets: aarch64-unknown-none, aarch64-unknown-uefi
          components: clippy, rustfmt

      - name: Install QEMU, AAVMF firmware and swtpm
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 swtpm swtpm-tools

      - name: Warm the cargo cache
        run: cargo fetch --locked
